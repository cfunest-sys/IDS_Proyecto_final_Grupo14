<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <!-- 1. Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 2. Bootstrap Icons (El que te pasé) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 3. Tus estilos personalizados (Siempre al final para que puedan pisar a Bootstrap si hace falta) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <header aria-label="Encabezado">
        {% include 'navbar.html' %} 
    </header>

    <main id="contenido-principal" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <footer aria-label="Pie de página">
        <div class="container text-center mt-5">
            <p>&copy; Universidad de Buenos Aires</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle (OBLIGATORIO para que funcionen los Modales) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
