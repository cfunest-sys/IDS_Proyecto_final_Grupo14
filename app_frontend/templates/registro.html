{% extends "base.html" %}

{% block title %}
Registro de Profesor - Campus FIUBA
{% endblock %}

{% block content %}

<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm card-custom p-4">

                <h1 class="page-title text-center">
                    Registro de Profesor
                </h1>

                {% if error %}

                <div class="alert alert-danger">
                    {{ error }}
                </div>

                {% endif %}

                <form action="/register" method="POST">

                    <div class="mb-3">

                        <label for="nombre" class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            name="nombre"
                            required>

                    </div>

                    <div class="mb-3">

                        <label for="departamento" class="form-label">
                            Departamento
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="departamento"
                            name="departamento"
                            required>

                    </div>

                    <div class="mb-3">

                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            required>

                    </div>

                    <div class="mb-4">

                        <label for="password" class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required>

                    </div>

                    <div class="text-center">

                        <button
                            type="submit"
                            class="btn btn-campus">

                            Registrarse

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</section>

{% endblock %}
